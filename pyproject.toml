[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-regret"
version = "0.1.0"
description = "Zero-model lower bound: how many merged (AI-agent) PRs get reverted or fixed within 7 days?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "James3014" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pr-regret = "pr_regret.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
